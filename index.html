<!DOCTYPE html>
<html lang="sq">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Punime elektrike</title>
<meta name="theme-color" content="#1a6ef0">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Elektrike">
<style>
:root{--bg:#f4f4f2;--surf:#fff;--text:#1c1c1a;--mut:#6b6b66;--bd:#d8d8d2;--acc:#1a6ef0;--cel:#e66a00}
@media (prefers-color-scheme:dark){:root{--bg:#141413;--surf:#222220;--text:#f0f0ec;--mut:#a0a09a;--bd:#3a3a36;--acc:#5b9bff}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%;background:var(--bg);color:var(--text);font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
body{display:flex;flex-direction:column;justify-content:center;min-height:100vh;min-height:100dvh;padding:calc(20px + env(safe-area-inset-top,0px)) 16px calc(20px + env(safe-area-inset-bottom,0px))}
main{width:100%;max-width:460px;margin:0 auto}
h1{font-size:22px;margin:0 0 4px}
p.s{margin:0 0 22px;color:var(--mut);font-size:14px}
a.card{display:flex;align-items:center;gap:16px;padding:18px;margin-bottom:12px;background:var(--surf);border:1px solid var(--bd);border-radius:16px;color:inherit;text-decoration:none;transition:transform .08s}
a.card:active{transform:scale(.98)}
.ic{flex:none;width:56px;height:56px;border-radius:14px;display:flex;align-items:center;justify-content:center;color:#fff}
.ic svg{width:32px;height:32px;fill:none;stroke:#fff;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.t{flex:1;min-width:0}
.t b{display:block;font-size:18px}
.t span{display:block;font-size:14px;color:var(--mut);margin-top:2px}
.go{color:var(--mut);font-size:26px;line-height:1}
</style>
</head>
<body>
<main>
  <h1>Punime elektrike</h1>
  <p class="s">Zgjidh faqen që do të hapësh.</p>
  <a class="card" href="kutite.html">
    <div class="ic" style="background:var(--acc)"><svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M3 9h18M9 21V9"/></svg></div>
    <div class="t"><b>Kutitë elektrike</b><span>Shëno çelësat, prizat dhe tekstet mbi projektin</span></div>
    <div class="go">›</div>
  </a>
  <a class="card" href="materialet.html">
    <div class="ic" style="background:var(--cel)"><svg viewBox="0 0 24 24"><path d="M9 6h11M9 12h11M9 18h11"/><path d="M4 6h.01M4 12h.01M4 18h.01" stroke-width="3"/></svg></div>
    <div class="t"><b>Materialet</b><span>Lista e materialeve për çdo person</span></div>
    <div class="go">›</div>
  </a>
</main>
<script>if('serviceWorker' in navigator)window.addEventListener('load',function(){navigator.serviceWorker.register('sw.js').catch(function(){})});</script>
</body>
</html>
