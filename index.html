<!DOCTYPE html>
<html lang="sq">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Kutitë elektrike</title>
<meta name="theme-color" content="#1a6ef0">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Kutitë">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<style>
:root{--bg:#f4f4f2;--surf:#fff;--text:#1c1c1a;--mut:#6b6b66;--bd:#d8d8d2;--acc:#1a6ef0;--cel:#e66a00;--pri:#1a6ef0;--tj:#8a3ffc;--danger:#d23b3b;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#141413;--surf:#222220;--text:#f0f0ec;--mut:#a0a09a;--bd:#3a3a36;--acc:#5b9bff;--danger:#ff6b6b}}
:root[data-theme="dark"]{--bg:#141413;--surf:#222220;--text:#f0f0ec;--mut:#a0a09a;--bd:#3a3a36;--acc:#5b9bff;--danger:#ff6b6b}
*{box-sizing:border-box}
html,body{height:100%;margin:0;background:var(--bg);color:var(--text);font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;overflow:hidden}
#app{display:flex;flex-direction:column;height:100%}
header{display:flex;gap:8px;align-items:center;padding:8px 10px;background:var(--surf);border-bottom:1px solid var(--bd)}
header h1{font-size:16px;margin:0;flex:1}
header small{font-weight:400;color:var(--mut);font-size:12px}
.note{font-size:13px;color:var(--mut);margin:0 0 10px}
button{font:inherit;color:var(--text);background:var(--surf);border:1px solid var(--bd);border-radius:10px;padding:8px 12px;cursor:pointer}
button.pri{background:var(--acc);border-color:var(--acc);color:#fff}
button.dng{color:var(--danger)}
#view{flex:1;position:relative;overflow:hidden;touch-action:none;background:var(--bg)}
#stage{position:absolute;left:0;top:0;transform-origin:0 0;user-select:none;-webkit-user-select:none}
#stage img{display:block;max-width:none;pointer-events:none;-webkit-user-drag:none}
.mk{position:absolute;width:36px;height:36px;margin:0;display:flex;align-items:center;justify-content:center;transform:translate(-50%,-50%) scale(var(--inv,1))}
.mk .n{position:absolute;right:-9px;bottom:-9px;min-width:16px;height:16px;padding:0 3px;border-radius:8px;background:#1c1c1a;color:#fff;border:1px solid #fff;font:700 10px/14px system-ui,sans-serif;text-align:center}
.mk.sel{z-index:4;transform:translate(-50%,-50%) scale(calc(var(--inv,1)*1.25))}
.mk.sel::before{content:"";position:absolute;inset:-8px;border:3px solid var(--danger);border-radius:50%;box-shadow:0 0 0 3px #fff,0 0 18px 5px rgba(210,59,59,.6);animation:pls 1.2s ease-in-out infinite}
@keyframes pls{50%{transform:scale(1.12);opacity:.7}}
#stage.foc .mk:not(.sel){opacity:.22}
.t-celes{color:var(--cel)}.t-prize{color:var(--pri)}.t-tjeter{color:var(--tj)}.t-tekst{color:#555}
.sym{width:100%;height:100%;overflow:visible;display:block;filter:drop-shadow(0 1px 2px rgba(0,0,0,.55))}
.sym .bg *{fill:currentColor;stroke:#fff;stroke-width:2}
.sym .gl *{fill:none;stroke:#fff;stroke-width:3.2;stroke-linecap:round;stroke-linejoin:round}
.sym .gl .f{fill:#fff}
#modes{position:absolute;top:8px;left:50%;transform:translateX(-50%);z-index:5;display:none;padding:3px;background:var(--surf);border:1px solid var(--bd);border-radius:999px;box-shadow:0 2px 8px rgba(0,0,0,.25)}
#modes button{border:0;border-radius:999px;padding:6px 16px;font-size:14px;background:transparent}
#modes button.on{background:var(--acc);color:#fff;font-weight:600}
#empty{position:absolute;inset:0;display:flex;flex-direction:column;gap:12px;align-items:center;justify-content:center;text-align:center;padding:24px;color:var(--mut)}
#hint{pointer-events:none;position:absolute;left:8px;right:8px;bottom:8px;background:var(--acc);color:#fff;padding:8px 12px;border-radius:10px;text-align:center;display:none}
.sheet{position:fixed;left:0;right:0;bottom:0;max-width:560px;margin:0 auto;background:var(--surf);border:1px solid var(--bd);border-bottom:0;border-radius:14px 14px 0 0;padding:10px 12px calc(10px + env(safe-area-inset-bottom,0px));max-height:80%;overflow:auto;display:none;box-shadow:0 -4px 20px rgba(0,0,0,.25)}
.sheet h2{margin:0 0 8px;font-size:15px}
.sh-head{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.sh-head h2{margin:0;flex:1}
.sh-head .ic{width:32px;height:32px;flex:none}
.seg{display:flex;gap:6px;margin-bottom:8px}
.seg button{flex:1;display:flex;align-items:center;justify-content:center;gap:6px;padding:6px 4px;font-size:14px;min-width:0}
.seg button .sym{width:26px;height:26px;flex:none}
.seg button.on{border:2px solid var(--acc);font-weight:700;padding:5px 3px}
.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-bottom:8px}
label{display:block;font-size:11.5px;color:var(--mut);margin-bottom:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
input[type=number],input[type=text],input[type=email],input[type=password]{width:100%;font:inherit;font-size:16px;padding:7px 8px;border:1px solid var(--bd);border-radius:10px;background:var(--bg);color:var(--text)}
.u{position:relative}.u input{padding-right:28px}
.u span{position:absolute;right:8px;top:50%;transform:translateY(-50%);font-size:12px;color:var(--mut);pointer-events:none}
.fld{margin-bottom:8px}
.acts{display:flex;gap:6px;flex-wrap:wrap}.acts button{flex:1;min-width:70px;padding:7px 8px;font-size:14px}
.vals{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-bottom:8px}
.vals>div{background:var(--bg);border:1px solid var(--bd);border-radius:10px;padding:6px 8px;min-width:0}
.vals small{display:block;font-size:11px;color:var(--mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.vals b{font-size:20px;font-weight:700}.vals b i{font-size:12px;font-weight:400;font-style:normal;color:var(--mut)}
.inote{font-size:14px;margin:0 0 8px}
.item{display:flex;gap:12px;align-items:center;padding:8px 0;border-bottom:1px solid var(--bd);cursor:pointer}
.item .mk{position:static;transform:none;flex:none;margin-right:6px}
.item small{color:var(--mut);display:block}
.ico{flex:none;padding:4px 9px;font-size:14px}
#bImgs{max-width:130px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.item b{word-break:break-word}
.mk.tx{width:auto;height:auto;padding:3px 9px;background:#fff;color:#1c1c1a;border:1.5px solid #1c1c1a;border-radius:8px;font:700 15px/1.2 system-ui,sans-serif;white-space:nowrap}
.mk.tx.sel::before{border-radius:12px}
body.kb #edit .sh-head,body.kb #edit .seg,body.kb #edit #eLabRow,body.kb #edit #eMove,body.kb #edit #eDel{display:none}
body.kb .sheet{padding-top:8px;max-height:none}
body.kb #edit .g3,body.kb #edit .fld{margin-bottom:6px}
#inst{position:fixed;left:8px;right:8px;top:calc(8px + env(safe-area-inset-top,0px));z-index:60;max-width:520px;margin:0 auto;display:none;align-items:center;gap:10px;padding:10px 12px;background:var(--surf);border:1px solid var(--bd);border-radius:14px;box-shadow:0 4px 18px rgba(0,0,0,.3)}
#inst img{width:44px;height:44px;border-radius:10px;flex:none}
#inst div{flex:1;font-size:14px;line-height:1.3}
#inst b{display:block;font-size:15px}
#inst button{padding:7px 12px;font-size:14px}
</style>
</head>
<body>
<div id="app">
  <header>
    <h1>Kutitë elektrike <small id="st"></small></h1>
    <button id="bImgs">Imazhet</button>
    <button id="bList">Lista</button>
    <button id="bPlan">Projekti</button>
  </header>
  <div id="view">
    <div id="stage"><img id="img" alt="Projekti"></div>
    <div id="empty"><div>Ngarko foton ose screenshot-in e projektit (planimetrisë) për të filluar.</div><button class="pri" id="bLoad">Zgjidh projektin</button></div>
    <div id="modes"><button data-m="view">Shiko</button><button data-m="edit">Ndrysho</button></div>
    <div id="hint"></div>
  </div>
</div>
<div id="inst"><img src="icon-192.png" alt=""><div><b>Instalo aplikacionin</b><span id="instT">Hape më shpejt nga ekrani kryesor, edhe pa internet.</span></div><button class="pri" id="instGo">Instalo</button><button id="instNo" aria-label="Mbyll">✕</button></div>
<input type="file" id="file" accept="image/*" hidden>

<div class="sheet" id="edit">
  <div class="sh-head"><div class="ic" id="eIc"></div><h2 id="eTitle">Kuti e re</h2></div>
  <div class="seg" id="types"></div>
  <div class="fld" id="eLabRow"><button id="eLab" style="padding:4px 10px;font-size:13px">✎ Ndrysho emrat e fushave për këtë simbol</button></div>
  <div class="g3" id="g3">
    <div><label id="lH"></label><div class="u"><input type="number" id="fH" inputmode="decimal"><span>cm</span></div></div>
    <div><label id="lL"></label><div class="u"><input type="number" id="fL" inputmode="decimal"><span>cm</span></div></div>
    <div><label id="lR"></label><div class="u"><input type="number" id="fR" inputmode="decimal"><span>cm</span></div></div>
  </div>
  <div class="fld" id="wRow"><input type="text" id="fW" placeholder="Çfarë është? p.sh. kuti shpërndarjeje, TV, ventilator"></div>
  <div class="fld"><input type="text" id="fN" placeholder="Shënim (opsionale)"></div>
  <div class="acts">
    <button class="pri" id="eSave">Ruaj</button>
    <button id="eMove">Zhvendos</button>
    <button class="dng" id="eDel">Fshi</button>
    <button id="eCancel">Mbyll</button>
  </div>
</div>

<div class="sheet" id="info">
  <div class="sh-head"><div class="ic" id="iIc"></div><h2 id="iTitle"></h2></div>
  <div class="vals" id="iVals"></div>
  <p class="inote" id="iNote"></p>
  <div class="acts"><button id="iEdit">Ndrysho</button><button id="iClose">Mbyll</button></div>
</div>

<div class="sheet" id="list">
  <h2>Lista e kutive</h2>
  <div id="items"></div>
  <div class="acts" style="margin-top:12px"><button class="pri" id="lSave">Shkarko PDF</button><button id="lClose">Mbyll</button></div>
</div>

<div class="sheet" id="imgs">
  <h2>Imazhet</h2>
  <div id="iList"></div>
  <div class="acts" style="margin-top:12px"><button class="pri" id="iAdd">+ Shto imazh</button><button id="iX">Mbyll</button></div>
</div>

<div class="sheet" id="plan">
  <h2>Imazhi aktual</h2>
  <div class="acts"><button id="pReplace">Ndrysho foton</button><button id="pFit">Përshtat pamjen</button><button id="pSync">Sinkronizim (cloud)</button><button id="pExp">Eksporto kopje</button><button id="pImp">Importo kopje</button><button class="dng" id="pClear">Fshi të gjitha shenjat</button><button id="pClose">Mbyll</button></div>
</div>
<input type="file" id="file2" accept=".json,application/json" hidden>
<div class="sheet" id="sync">
  <h2>Sinkronizim (Firebase)</h2>
  <p class="note" id="uTxt"></p>
  <div id="uF"><div class="fld"><input type="email" id="uE" placeholder="Email" autocomplete="email" autocapitalize="off" inputmode="email"></div>
  <div class="fld"><input type="password" id="uP" placeholder="Fjalëkalimi" autocomplete="current-password"></div></div>
  <div class="acts"><button class="pri" id="cIn">Hyr</button><button id="cRes">Harrova fjalëkalimin</button><button id="cOut">Dil</button><button id="cPull">Shkarko nga cloud</button><button id="cClose">Mbyll</button></div>
</div>

<script>
/* NGJIT KËTU konfigurimin e Firebase (në vend të null), p.sh. {apiKey:"...",authDomain:"...",projectId:"...",appId:"..."} */
var FIREBASE_CONFIG = {
  apiKey: "AIzaSyBzKNso8S23CyUCliXJH4JhlHgogeQ1Qx0",
  authDomain: "kutite-elektrike.firebaseapp.com",
  projectId: "kutite-elektrike",
  storageBucket: "kutite-elektrike.firebasestorage.app",
  messagingSenderId: "870521174345",
  appId: "1:870521174345:web:f82182c38aba572c564298",
  measurementId: "G-QS6BDM2KW8"
};

<script>
(function(){
  var $=function(i){return document.getElementById(i)};
  var view=$('view'),stage=$('stage'),img=$('img'),hint=$('hint');
  var NP=function(){return{id:'',name:'',blob:null,marks:[],imgT:0,imgDirty:false}};
  var A={plans:[],act:'',labels:{h:'Nga dyshemeja',l:'Nga muri majtas',r:'Nga muri djathtas'},updated:0},S=NP(),addNew=false,sc=1,tx=0,ty=0,cur=null,moving=null,mem=false,selId=null,infoM=null,mode='view';
  var LBL={celes:'Çelës',prize:'Prizë',tjeter:'Tjetër',tekst:'Tekst'};
  /* simbolet elektrike: ikonë e bardhë e trashë mbi shenjë me ngjyrë (çelës = rreth portokalli me simbolin klasik: unazë + levë + vizë tërthore, prizë = rreth blu, tjetër = katror vjollcë) */
  var SH={
    celes:'<circle cx="10" cy="23.5" r="4.2" style="stroke-width:2.8"/><path d="M12 20L21 6.5M17.6 4.6l6.8 4.6" style="stroke-width:2.8"/>',
    prize:'<circle cx="16" cy="16" r="7.5"/><path class="f" d="M8.5 16a7.5 7.5 0 0 1 15 0z"/><path d="M5.5 16h21"/>',
    tekst:'<path d="M9 10h14M16 10v13M12 23h8"/>',
    tjeter:'<path d="M10 10l12 12M22 10L10 22"/>'
  };
  var BG={tjeter:'<rect x="2" y="2" width="28" height="28" rx="7"/>'};
  function sym(t){return '<svg class="sym t-'+t+'" viewBox="-1 -1 34 34" aria-hidden="true"><g class="bg">'+(BG[t]||'<circle cx="16" cy="16" r="15"/>')+'</g><g class="gl">'+SH[t]+'</g></svg>'}
  function full(m){return LBL[m.type]+((m.type==='tjeter'||m.type==='tekst')&&m.what?': '+m.what:'')}
  function lbl(m,k){return (m.lb&&m.lb[k])||A.labels[k]}
  function num(m){var n=0;for(var i=0;i<S.marks.length;i++){if(S.marks[i].type!=='tekst')n++;if(S.marks[i]===m)break}return n}

  /* ---------- storage (IndexedDB, with in-memory fallback) ---------- */
  var db=null;
  function openDB(cb){
    try{
      var r=indexedDB.open('kutite',1);
      r.onupgradeneeded=function(){r.result.createObjectStore('k')};
      r.onsuccess=function(){db=r.result;cb()};
      r.onerror=function(){mem=true;cb()};
    }catch(e){mem=true;cb()}
  }
  function idbPut(){
    if(!db)return;
    try{db.transaction('k','readwrite').objectStore('k').put({v:2,plans:A.plans,act:A.act,labels:A.labels,updated:A.updated},'state')}catch(e){}
  }
  function save(){A.updated=Date.now();idbPut();push()}
  function setAct(id){S=A.plans.filter(function(p){return p.id===id})[0]||NP();A.act=S.id;$('bImgs').textContent=(S.name||'Imazhet')+' ▾'}
  function paintLabels(b){b=b||{};$('lH').textContent=b.h||A.labels.h;$('lL').textContent=b.l||A.labels.l;$('lR').textContent=b.r||A.labels.r}
  function load(cb){
    if(!db)return cb();
    try{
      var st=db.transaction('k').objectStore('k'),q=st.get('state');
      q.onsuccess=function(){
        var v=q.result;
        if(v){A.plans=v.plans||[];A.labels=v.labels||A.labels;A.updated=v.updated||0;setAct(v.act);cb();return}
        var o=st.get('plan');/* migrim nga versioni i vjetër me një imazh */
        o.onsuccess=function(){var w=o.result;
          if(w&&w.blob){A.plans=[{id:'p1',name:'Imazhi 1',blob:w.blob,marks:w.marks||[],imgT:w.imgT||0,imgDirty:!!w.imgDirty}];A.updated=w.updated||0;setAct('p1')}
          cb()};
        o.onerror=function(){cb()};
      };
      q.onerror=function(){cb()};
    }catch(e){cb()}
  }

  /* ---------- view transform ---------- */
  function apply(){
    stage.style.transform='translate('+tx+'px,'+ty+'px) scale('+sc+')';
    /* simbolet janë pjesë e projektit: zmadhohen e zvogëlohen bashkë me të. Madhësia bazë: ~24px kur projekti është i përshtatur në ekran */
    var k=1;
    if(img.naturalWidth){var b=Math.min(view.clientWidth/img.naturalWidth,view.clientHeight/img.naturalHeight);k=(24/b)/36}
    stage.style.setProperty('--inv',String(k));
  }
  function fit(){
    if(!img.naturalWidth)return;
    var vw=view.clientWidth,vh=view.clientHeight;
    sc=Math.min(vw/img.naturalWidth,vh/img.naturalHeight);
    tx=(vw-img.naturalWidth*sc)/2;ty=(vh-img.naturalHeight*sc)/2;apply();
  }
  function showImg(){
    $('modes').style.display=S.blob?'flex':'none';
    if(!S.blob){$('empty').style.display='flex';stage.style.display='none';return}
    $('empty').style.display='none';stage.style.display='block';
    img.onload=function(){fit();render()};
    img.src=URL.createObjectURL(S.blob);
  }

  /* ---------- markers ---------- */
  function render(){
    stage.classList.toggle('foc',!!selId);
    var old=stage.querySelectorAll('.mk');
    for(var i=0;i<old.length;i++)old[i].remove();
    S.marks.forEach(function(m,i){
      var d=document.createElement('div');
      d.className='mk t-'+m.type+(m.type==='tekst'?' tx':'')+(selId===m.id?' sel':'');
      d.innerHTML=m.type==='tekst'?esc(m.what||'Tekst'):sym(m.type)+'<span class="n">'+num(m)+'</span>';d.dataset.id=m.id;
      d.style.left=(m.x*100)+'%';d.style.top=(m.y*100)+'%';
      stage.appendChild(d);
    });
    img.style.width=img.naturalWidth+'px';
  }
  function fmt(m){
    var p=[];
    if(m.h!==''&&m.h!=null)p.push(lbl(m,'h')+' '+m.h+' cm');
    if(m.l!==''&&m.l!=null)p.push(lbl(m,'l')+' '+m.l+' cm');
    if(m.r!==''&&m.r!=null)p.push(lbl(m,'r')+' '+m.r+' cm');
    return p.join(' · ');
  }

  /* ---------- edit sheet ---------- */
  var curType='celes',curLb={};
  $('types').innerHTML=['celes','prize','tjeter','tekst'].map(function(t){return '<button data-t="'+t+'">'+sym(t)+LBL[t]+'</button>'}).join('');
  function setType(t){
    curType=t;
    var b=$('types').children;
    for(var i=0;i<b.length;i++)b[i].classList.toggle('on',b[i].dataset.t===t);
    var tx=t==='tekst';
    $('wRow').style.display=(t==='tjeter'||tx)?'':'none';
    $('g3').style.display=$('eLabRow').style.display=tx?'none':'';
    $('fW').placeholder=tx?'Teksti që shfaqet (p.sh. Dhoma e gjumit, Banjo)':'Çfarë është? p.sh. kuti shpërndarjeje, TV, ventilator';
    $('eIc').innerHTML=sym(t);
  }
  function hideSheets(){
    document.body.classList.remove('kb');
    ['edit','info','list','plan','sync','imgs'].forEach(function(i){$(i).style.display='none'});
  }
  function anySheet(){
    return ['edit','info','list','plan','sync','imgs'].some(function(i){return $(i).style.display==='block'});
  }
  function closeAll(){
    if(cur&&cur._new)S.marks=S.marks.filter(function(x){return x!==cur});
    cur=null;infoM=null;selId=null;hideSheets();render();
  }
  /* animim i qetë i pamjes */
  var anim=0;
  function animTo(ntx,nty,nsc,dur){
    cancelAnimationFrame(anim);
    var a=tx,b=ty,c=sc,t0=performance.now();
    (function step(t){
      var k=Math.min(1,(t-t0)/dur),e=1-Math.pow(1-k,3);
      tx=a+(ntx-a)*e;ty=b+(nty-b)*e;sc=c+(nsc-c)*e;apply();
      if(k<1)anim=requestAnimationFrame(step);
    })(t0);
  }
  /* fokuson simbolin e zgjedhur: e afron, e vendos në qendër të pjesës së dukshme (mbi dritaren e hapur) */
  var vv=window.visualViewport;
  function vTop(){return vv?vv.offsetTop:0}
  function vBot(){return vv?vv.offsetTop+vv.height:window.innerHeight}
  function focusMark(m,zoom,force){
    if(!img.naturalWidth)return;
    var r=view.getBoundingClientRect(),sh=null,ids=['edit','info'];
    for(var i=0;i<ids.length;i++)if($(ids[i]).style.display==='block')sh=$(ids[i]);
    var top=Math.max(r.top,vTop())+48,bot=Math.min(r.bottom,vBot(),sh?sh.getBoundingClientRect().top:r.bottom)-24;
    var W=img.naturalWidth,H=img.naturalHeight;
    if(!zoom&&!force){
      var mx=r.left+tx+m.x*W*sc,my=r.top+ty+m.y*H*sc;
      if(!(mx<r.left+24||mx>r.right-24||my<top||my>bot))return;
    }
    var base=Math.min(r.width/W,r.height/H);
    var ns=zoom?Math.min(12,Math.max(sc,base*2.5)):sc;

  /* PDF i thjeshtë (pa biblioteka, punon edhe pa internet): tekst Helvetica, A4, disa faqe */
  function pdfEsc(t){
    var m={'—':'\x97','–':'\x96','•':'\x95','’':'\x92','“':'\x93','”':'\x94','·':'\xB7'};
    return t.replace(/[^\x00-\xFF]/g,function(c){return m[c]||'?'}).replace(/([\\()])/g,'\\$1');
  }
  function pdfWrap(t,n){
    var out=[],w=t.split(' '),l='',ind='';
    w.forEach(function(x){
      if((l+' '+x).length>n&&l){out.push(l);l='    '+x}else l=l?l+' '+x:x;
    });
    if(l)out.push(l);return out;
  }
  function mkPdf(title,items){
    var H=842,M=56,LH=17,per=Math.floor((H-2*M)/LH),rows=[{t:title,b:1},{t:''}];
    items.forEach(function(it){pdfWrap(it,84).forEach(function(x){rows.push({t:x})})});
    var pages=[];for(var i=0;i<rows.length;i+=per)pages.push(rows.slice(i,i+per));
    var objs=[];
    objs[1]='<</Type/Catalog/Pages 2 0 R>>';
    var kids=pages.map(function(_,i){return (5+i*2)+' 0 R'}).join(' ');
    objs[2]='<</Type/Pages/Kids['+kids+']/Count '+pages.length+'>>';
    objs[3]='<</Type/Font/Subtype/Type1/BaseFont/Helvetica/Encoding/WinAnsiEncoding>>';
    objs[4]='<</Type/Font/Subtype/Type1/BaseFont/Helvetica-Bold/Encoding/WinAnsiEncoding>>';
    pages.forEach(function(pg,i){
      var c='';
      pg.forEach(function(r,j){
        if(r.t)c+='BT /'+(r.b?'F2 16':'F1 11')+' Tf 1 0 0 1 '+M+' '+(H-M-j*LH)+' Tm ('+pdfEsc(r.t)+') Tj ET\n';
      });
      objs[5+i*2]='<</Type/Page/Parent 2 0 R/MediaBox[0 0 595 842]/Resources<</Font<</F1 3 0 R/F2 4 0 R>>>>/Contents '+(6+i*2)+' 0 R>>';
      objs[6+i*2]='<</Length '+c.length+'>>\nstream\n'+c+'endstream';
    });
    var out='%PDF-1.4\n',off=[];
    for(var k=1;k<objs.length;k++){off[k]=out.length;out+=k+' 0 obj\n'+objs[k]+'\nendobj\n'}
    var x=out.length;
    out+='xref\n0 '+objs.length+'\n0000000000 65535 f \n';
    for(k=1;k<objs.length;k++)out+=('0000000000'+off[k]).slice(-10)+' 00000 n \n';
    out+='trailer\n<</Size '+objs.length+'/Root 1 0 R>>\nstartxref\n'+x+'\n%%EOF';
    var u=new Uint8Array(out.length);for(k=0;k<out.length;k++)u[k]=out.charCodeAt(k)&255;
    return new Blob([u],{type:'application/pdf'});
  }

  }

  function ud(){return firebase.firestore().collection('users').doc(user.uid)}
  function toDataUrl(blob){return new Promise(function(res){var f=new FileReader();f.onload=function(){res(f.result)};f.readAsDataURL(blob)})}
  var pt=null,busy=false;
  function push(){

  }
  function doPush(){
    if(!cfgOk()||!user)return;
    if(busy){pt=setTimeout(doPush,1500);return}
    busy=true;setSt('· po dërgohet…');
    var d=ud(),old={},leg=0,meta=[];
    d.get().then(function(snap){
      var r=snap.exists?snap.data():{};
      if(r.v===2)JSON.parse(r.plans||'[]').forEach(function(p){old[p.id]=p.n||0});
      else if(r.marks)leg=r.n||0;
      var seq=Promise.resolve();
      A.plans.forEach(function(p){
        var m={id:p.id,name:p.name,imgT:p.imgT,n:old[p.id]||0,marks:p.marks.filter(function(x){return !x._new})};
        meta.push(m);
        if(p.blob&&(p.imgDirty||!(p.id in old)))seq=seq.then(function(){return toDataUrl(p.blob)}).then(function(u){
          var b=firebase.firestore().batch(),n=0,i;
          for(i=0;i<u.length;i+=700000,n++)b.set(d.collection('chunks').doc(p.id+'_'+n),{d:u.slice(i,i+700000)});
          for(i=n;i<m.n;i++)b.delete(d.collection('chunks').doc(p.id+'_'+i));
          m.n=n;return b.commit().then(function(){p.imgDirty=false});
        });

      var b=firebase.firestore().batch(),i;

      for(var id in old)if(!A.plans.some(function(p){return p.id===id}))for(i=0;i<old[id];i++)b.delete(d.collection('chunks').doc(id+'_'+i));
      for(i=0;i<leg;i++)b.delete(d.collection('chunks').doc(String(i)));
      b.set(d,{v:2,updated:A.updated,labels:JSON.stringify(A.labels),plans:JSON.stringify(meta)});
      return b.commit();
    }).then(function(){idbPut();setSt('· u sinkronizua ✓')})
    .catch(function(){setSt('· gabim sinkronizimi')})
    .then(function(){busy=false});
  }
  function pull(force){

    var d=ud();

      if(!snap.exists){
        if(A.plans.length){A.plans.forEach(function(p){p.imgDirty=true});if(!A.updated)A.updated=Date.now();doPush()}else setSt('· cloud bosh');
        return;
      }
      var r=snap.data(),ru=r.updated||0,v2=r.v===2;
      if(!(force===true||ru>A.updated||(!v2&&!A.plans.length))){if(ru<A.updated||!v2)doPush();else setSt('· u sinkronizua ✓');return}
      var rp=v2?JSON.parse(r.plans||'[]'):[{id:'p1',name:'Imazhi 1',imgT:r.imgT||0,n:r.n||0,marks:JSON.parse(r.marks||'[]')}];
      var lc=function(p){return A.plans.filter(function(x){return x.id===p.id})[0]};
      var need=function(p){var l=lc(p);return p.n&&(!l||!l.blob||l.imgT!==p.imgT)};
      return (rp.some(need)?d.collection('chunks').get():Promise.resolve(null)).then(function(q){
        var ch={};if(q)q.forEach(function(c){ch[c.id]=c.data().d});
        return Promise.all(rp.map(function(p){
          var l=lc(p),np={id:p.id,name:p.name,marks:p.marks||[],imgT:p.imgT,imgDirty:false,blob:l&&l.blob};
          if(!need(p))return np;
          var a=[];for(var i=0;i<p.n;i++)a.push(ch[v2?p.id+'_'+i:String(i)]||'');
          return fetch(a.join('')).then(function(x){return x.blob()}).then(function(b){np.blob=b;return np});
        }));
      }).then(function(np){
        var keep=A.act,pb=S.blob;
        A.plans=np.filter(function(p){return p.blob});A.updated=ru;
        if(v2&&r.labels)A.labels=JSON.parse(r.labels);
        setAct(A.plans.some(function(p){return p.id===keep})?keep:(A.plans[0]&&A.plans[0].id));
        idbPut();paintLabels();
        if(S.blob===pb)render();else showImg();
        setSt('· u sinkronizua ✓');
      });
    }).catch(function(){setSt('· gabim sinkronizimi')});
  }
  $('pSync').onclick=function(){updUser();hideSheets();$('sync').style.display='block'};
  $('cClose').onclick=hideSheets;
  function authMsg(x){
    var m={'auth/invalid-email':'Email-i nuk është i vlefshëm.','auth/invalid-credential':'Email ose fjalëkalim i gabuar.','auth/wrong-password':'Fjalëkalim i gabuar.','auth/user-not-found':'Nuk ekziston llogari me këtë email. Llogaritë krijohen vetëm nga administratori.','auth/email-already-in-use':'Ky email ka tashmë llogari. Shtyp “Hyr”.','auth/weak-password':'Fjalëkalimi duhet të ketë të paktën 6 shkronja.','auth/too-many-requests':'Shumë përpjekje. Provo pak më vonë.','auth/network-request-failed':'Nuk ka lidhje me internetin.','auth/operation-not-allowed':'Hyrja me email nuk është aktivizuar në Firebase (Authentication → Sign-in method → Email/Password).','auth/missing-password':'Shkruaj fjalëkalimin.'};
    return m[x&&x.code]||('Gabim: '+(x&&x.code?x.code:x));
  }
  function authGo(kind){
    var e=$('uE').value.trim(),p=$('uP').value;
    if(!e||(!p&&kind!=='res')){alert('Shkruaj email-in'+(kind==='res'?'.':' dhe fjalëkalimin.'));return}
    var go=function(){
      if(!window.firebase){alert('Nuk ka lidhje me internetin.');return}
      var a=firebase.auth(),pr=kind==='res'?a.sendPasswordResetEmail(e):a.signInWithEmailAndPassword(e,p);
      pr.then(function(){
        $('uP').value='';
        if(kind==='res')alert('Të dërgova lidhjen për fjalëkalim të ri në email (shiko edhe te Spam).');else hideSheets();
      }).catch(function(x){alert(authMsg(x))});
    };
    if(window.firebase&&firebase.apps&&firebase.apps.length)go();else initFb().then(go);
  }
  $('cIn').onclick=function(){authGo('in')};
  $('cRes').onclick=function(){authGo('res')};
  $('cOut').onclick=function(){firebase.auth().signOut()};
  $('cPull').onclick=function(){
    if(confirm('Të zëvendësoj të dhënat në këtë pajisje me ato nga cloud?')){hideSheets();pull(true)}
  };
  document.addEventListener('visibilitychange',function(){
    if(!document.hidden&&$('edit').style.display!=='block'&&!moving)pull();
  });

  /* ---------- backup file ---------- */
  $('pExp').onclick=function(){
    hideSheets();
    var rd=function(b){return new Promise(function(res){if(!b)return res(null);var f=new FileReader();f.onload=function(){res(f.result)};f.readAsDataURL(b)})};
    Promise.all(A.plans.map(function(p){return rd(p.blob).then(function(u){return{id:p.id,name:p.name,marks:p.marks.filter(function(m){return !m._new}),img:u}})})).then(function(ps){
      var t=JSON.stringify({v:2,updated:A.updated,labels:A.labels,plans:ps});
      var a=document.createElement('a');a.href=URL.createObjectURL(new Blob([t],{type:'application/json'}));
      a.download='kutite-kopje.json';document.body.appendChild(a);a.click();a.remove();
    });
  };
  $('pImp').onclick=function(){$('file2').click()};
  $('file2').onchange=function(){
    var f=this.files[0];this.value='';if(!f)return;
    if(!confirm('Importimi zëvendëson TË GJITHA imazhet në këtë pajisje. Vazhdo?'))return;
    var r=new FileReader();
    r.onload=function(){
      try{
        var d=JSON.parse(r.result),ps=d.plans||[{id:'p1',name:'Imazhi 1',marks:d.marks,img:d.img}];
        Promise.all(ps.map(function(p,i){return (p.img?fetch(p.img).then(function(x){return x.blob()}):Promise.resolve(null)).then(function(b){return{id:p.id||('p'+Date.now()+i),name:p.name||('Imazhi '+(i+1)),blob:b,marks:p.marks||[],imgT:Date.now(),imgDirty:true}})})).then(function(np){
          A.plans=np.filter(function(p){return p.blob});if(d.labels)A.labels=d.labels;
          setAct(A.plans[0]&&A.plans[0].id);paintLabels();save();hideSheets();showImg();
        });
      }catch(e){alert('Skedari nuk është i vlefshëm.')}
    };
    r.readAsText(f);
  };

  try{mode=localStorage.getItem('kutiMode')==='edit'?'edit':'view'}catch(e){}
  paintModes();
  paintLabels();
  updUser();
  openDB(function(){load(function(){showImg();if(cfgOk())initFb()})});
})();
</script>
<script>
(function(){
  var bar=document.getElementById('inst'),go=document.getElementById('instGo'),no=document.getElementById('instNo'),tx=document.getElementById('instT'),ev=null;
  var standalone=function(){return (window.matchMedia&&matchMedia('(display-mode: standalone)').matches)||navigator.standalone===true};
  var ios=/iphone|ipad|ipod/i.test(navigator.userAgent)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1);
  var skipped=function(){try{return sessionStorage.getItem('instNo')==='1'}catch(e){return false}};
  function show(){if(!standalone()&&!skipped())bar.style.display='flex'}
  if('serviceWorker' in navigator)window.addEventListener('load',function(){navigator.serviceWorker.register('sw.js').catch(function(){})});
  window.addEventListener('beforeinstallprompt',function(e){e.preventDefault();ev=e;go.style.display='';show()});
  window.addEventListener('appinstalled',function(){bar.style.display='none';ev=null});
  go.onclick=function(){
    if(!ev)return;
    ev.prompt();
    ev.userChoice.then(function(){ev=null;bar.style.display='none'});
  };
  no.onclick=function(){bar.style.display='none';try{sessionStorage.setItem('instNo','1')}catch(e){}};
  /* iPhone/iPad (Safari) nuk e ka dritaren automatike: tregojmë udhëzimin */
  if(ios&&!standalone()){
    go.style.display='none';
    tx.innerHTML='Prek <b style="display:inline">Share ⎋</b> në Safari, pastaj <b style="display:inline">“Add to Home Screen”</b>.';
    show();
  }
})();
</script>
