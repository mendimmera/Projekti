<!DOCTYPE html>
<html lang="sq">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Materialet</title>
<meta name="theme-color" content="#1a6ef0">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Materialet">
<style>
:root{--bg:#f4f4f2;--surf:#fff;--text:#1c1c1a;--mut:#6b6b66;--bd:#d8d8d2;--acc:#1a6ef0;--cel:#e66a00;--pri:#1a6ef0;--sup:#8a3ffc;--oth:#0f9d8a;--danger:#d23b3b;--ok:#1f9d55}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#141413;--surf:#222220;--text:#f0f0ec;--mut:#a0a09a;--bd:#3a3a36;--acc:#5b9bff;--pri:#5b9bff;--sup:#b388ff;--oth:#3ecfb8;--danger:#ff6b6b}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text);font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
body{padding-bottom:calc(24px + env(safe-area-inset-bottom,0px))}
button{font:inherit;color:var(--text);background:var(--surf);border:1px solid var(--bd);border-radius:10px;padding:8px 12px;cursor:pointer}
button.pri{background:var(--acc);border-color:var(--acc);color:#fff}

.top{position:sticky;top:0;z-index:10;background:var(--surf);border-bottom:1px solid var(--bd);padding-top:env(safe-area-inset-top,0px)}
.bar{display:flex;align-items:center;gap:8px;padding:5px 8px}
.bar h1{flex:1;margin:0;font-size:16px}
.bar a.back{text-decoration:none;color:var(--text);border:1px solid var(--bd);border-radius:10px;padding:6px 12px;font-size:18px;line-height:1.2}
.bar button{padding:6px 12px;font-size:18px;line-height:1.2}
.chips{display:flex;gap:6px;padding:0 8px 6px}
.chips select{flex:1;min-width:0;border-width:2px;border-color:var(--bd)}
.chips select.act{border-color:var(--acc);color:var(--acc)}
select{width:100%;font:inherit;font-size:16px;font-weight:600;padding:5px 8px;border:1px solid var(--bd);border-radius:10px;background:var(--bg);color:var(--text)}
.mrow{display:flex;align-items:center;gap:6px;padding:6px 0;border-bottom:1px solid var(--bd)}.mrow span{flex:1;min-width:0;font-size:15px}.mrow.off span{color:var(--mut);text-decoration:line-through}
.sheet .mrow button{display:inline-block;width:auto;margin:0;padding:6px 10px;font-size:13px}
.sheet h4{margin:12px 0 2px;font-size:13px;color:var(--mut)}
.sheet{max-height:82%;overflow:auto}
.chip{flex:none;border-radius:999px;padding:6px 14px;font-size:14px;white-space:nowrap}
.chip.on{background:var(--acc);border-color:var(--acc);color:#fff;font-weight:600}
.chip.add{border-style:dashed;color:var(--mut)}

main{max-width:640px;margin:0 auto;padding:6px 8px}
h2.g{margin:12px 0 2px;font-size:13px;letter-spacing:.06em;text-transform:uppercase;color:var(--mut)}
h2.g:first-child{margin-top:4px}
h3{margin:8px 0 4px;font-size:14px;display:flex;align-items:center;gap:8px}
.hint{font-size:12px;color:var(--mut);margin:0 0 4px}

/* grupi 1: pllaka që prek për +1 */
.tiles{display:grid;grid-template-columns:repeat(2,1fr);gap:5px}
@media(min-width:480px){.tiles{grid-template-columns:repeat(3,1fr)}}
.tile{position:relative;display:flex;align-items:center;gap:4px;min-height:42px;padding:3px 4px 3px 8px;text-align:left;background:var(--surf);border:1px solid var(--bd);border-left:4px solid var(--gc);border-radius:9px;user-select:none;-webkit-user-select:none;touch-action:manipulation;transition:transform .08s}
.tiles.t3{grid-template-columns:repeat(3,1fr)}
.tile:active{transform:scale(.96)}
.tile.on{border-color:var(--gc);box-shadow:0 0 0 1px var(--gc) inset}
.tile .tl{flex:1;min-width:0;font-size:13px;line-height:1.15;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.tile .tn{font-size:22px;font-weight:700;line-height:1;color:var(--gc);font-variant-numeric:tabular-nums;min-width:20px;text-align:right}
.tile .tn.z{color:var(--mut);opacity:.45}
.tile .mn{flex:none;width:28px;height:28px;padding:0;border-radius:50%;font-size:18px;line-height:1;color:var(--mut)}
.tile .mn:active{background:var(--bg)}
.c-oth{--gc:var(--oth)}.c-cel{--gc:var(--cel)}.c-pri{--gc:var(--pri)}.c-sup{--gc:var(--sup)}

/* grupi 2 dhe 3: listë me numra */
.list{background:var(--surf);border:1px solid var(--bd);border-radius:12px;overflow:hidden}
.row{display:flex;align-items:center;gap:8px;padding:3px 8px 3px 10px;border-bottom:1px solid var(--bd);min-height:40px}
.row:last-child{border-bottom:0}
.row.on{background:color-mix(in srgb,var(--acc) 9%,var(--surf))}
.rl{flex:1;min-width:0;display:flex;align-items:center;gap:6px;font-size:14px;line-height:1.2}
.dot{width:12px;height:12px;border-radius:50%;border:1px solid rgba(128,128,128,.55);flex:none}
.u{position:relative;flex:none;width:92px}
.u input{width:100%;font:inherit;font-size:16px;font-weight:600;text-align:right;padding:4px 38px 4px 6px;border:1px solid var(--bd);border-radius:10px;background:var(--bg);color:var(--text);font-variant-numeric:tabular-nums}
.u span{position:absolute;right:9px;top:50%;transform:translateY(-50%);font-size:12px;color:var(--mut);pointer-events:none}
input:focus{outline:2px solid var(--acc);outline-offset:-1px}
input.vi{width:46px;font:inherit;font-size:16px;font-weight:600;text-align:center;padding:2px 2px;border:1px solid var(--bd);border-radius:8px;background:var(--bg);color:var(--text)}
.x{width:26px;height:26px;padding:0;border-radius:50%;color:var(--mut);flex:none;font-size:16px;line-height:1}
.addv{display:block;width:100%;border:0;border-top:1px dashed var(--bd);border-radius:0;background:transparent;color:var(--acc);font-size:13px;padding:6px}

button.addm{display:block;width:100%;margin-top:6px;padding:5px;border-style:dashed;color:var(--acc);font-size:14px}
.tile .dx{flex:none;width:22px;height:22px;padding:0;border-radius:50%;font-size:13px;line-height:1;color:var(--mut);border:0;background:transparent}
.pact{display:flex;flex-wrap:wrap;gap:8px;margin:22px 0 8px}.pact button{flex:1;font-size:14px;padding:8px 6px}
.ph{display:flex;align-items:center;gap:8px;margin:14px 0 4px}
.ph h2{flex:1;margin:0;font-size:17px;min-width:0;overflow:hidden;text-overflow:ellipsis}
.ph button{padding:4px 10px;font-size:14px;font-weight:600;color:var(--acc)}
.seg{display:flex;gap:6px;margin:6px 0 10px}.seg button{flex:1;text-align:center;margin:0}.seg button.on{border:2px solid var(--acc);font-weight:700;padding:9px 11px}
.sheet input.nm{width:100%;font:inherit;font-size:16px;padding:9px 10px;border:1px solid var(--bd);border-radius:10px;background:var(--bg);color:var(--text)}
.sheet .two{display:flex;gap:8px}.sheet .two button{text-align:center;margin:0}
/* totali */
.sum .row{min-height:36px}
.sum b{font-variant-numeric:tabular-nums;font-size:16px}
.sum .row span.unit{color:var(--mut);font-size:13px;margin-left:4px;font-weight:400}
.empty{color:var(--mut);text-align:center;padding:30px 10px}

/* meny */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:30;display:none}
.sheet{position:fixed;left:0;right:0;bottom:0;max-width:560px;margin:0 auto;z-index:31;background:var(--surf);border:1px solid var(--bd);border-bottom:0;border-radius:14px 14px 0 0;padding:10px 12px calc(10px + env(safe-area-inset-bottom,0px));display:none;box-shadow:0 -4px 20px rgba(0,0,0,.25)}
.sheet h2{margin:0 0 8px;font-size:15px}
.sheet button{display:block;width:100%;text-align:left;margin-bottom:6px;padding:11px 12px}
.sheet button.dng{color:var(--danger)}
#toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:40;background:#1c1c1a;color:#fff;padding:9px 16px;border-radius:999px;font-size:14px;opacity:0;pointer-events:none;transition:opacity .2s;max-width:90%;text-align:center}
#toast.show{opacity:1}
</style>
</head>
<body>
<div class="top">
  <div class="bar">
    <a class="back" href="index.html" aria-label="Kreu">‹</a>
    <h1>Materialet <small id="st" style="font-weight:400;color:var(--mut);font-size:12px"></small></h1>
    <button id="bMenu" aria-label="Menyja">⋯</button>
  </div>
  <div class="chips"><select id="selP" aria-label="Personat"></select><select id="selT" aria-label="Totalet"></select></div>
</div>
<main id="main"></main>

<div class="scrim" id="scrim"></div>
<div class="sheet" id="sheet"></div>
<div id="toast"></div>
<input type="file" id="file" accept="application/json,.json" hidden>

<script>
var FIREBASE_CONFIG = {
  apiKey: "AIzaSyBzKNso8S23CyUCliXJH4JhlHgogeQ1Qx0",
  authDomain: "kutite-elektrike.firebaseapp.com",
  projectId: "kutite-elektrike",
  storageBucket: "kutite-elektrike.firebasestorage.app",
  messagingSenderId: "870521174345",
  appId: "1:870521174345:web:f82182c38aba572c564298",
  measurementId: "G-QS6BDM2KW8"
};
</script>
<script>
(function(){
  var $=function(i){return document.getElementById(i)};
  var KEY='materialet1';

  /* ---------- lista e materialeve ---------- */
  /* grupi 1: prek për +1 */
  var G1=[
    {t:'Çelësa',c:'c-cel',items:[['c_thj','Çelës i thjeshtë'],['c_dev','Devijator'],['c_inv','Invertitor'],['c_01','Çelës 0-1']]},
    {t:'Priza',c:'c-pri',items:[['p_shu','Prizë shuko'],['p_biv','Prizë bivalente'],['p_tv','Prizë TV'],['p_net','Prizë interneti']]},
    {t:'Suporte + kapakë',c:'c-sup',items:[['s3','3M','Suport + kapak 3M'],['s4','4M','Suport + kapak 4M'],['s6','6M','Suport + kapak 6M']]},
    {t:'Të tjera',c:'c-oth',items:[['tapa','Tapë fallco'],['bzile','Buton zile'],['zile','Zile']]}
  ];
  function wire(pref,mm,cols,unit){return cols.map(function(c){return {k:pref+'_'+c[0],l:c[1],full:'Tel '+mm+' '+c[1],u:'m',dot:c[2]}})}
  var Z='#1c1c1a',BL='#1a6ef0',KU='#d23b3b',KA='#8b5a2b',GR='#9a9a96',VE='#f2c200';
  /* grupet 2 dhe 3: shkruaj numrin (copë ose metra) */
  var G2=[
    {t:'Automatë',items:[
      {k:'a10',l:'Automat 10 A',u:'copë'},{k:'a16',l:'Automat 16 A',u:'copë'},{k:'a20',l:'Automat 20 A',u:'copë'},
      {k:'salva',pre:'Salva Vita',post:'A',u:'copë',vr:1},
      {k:'rreg',l:'Rregullator tensioni',u:'copë'},{k:'ure',l:'Urë automatesh',u:'copë'}]},
    {t:'Klema',items:[{k:'k6',l:'Klemë 6 mm²',u:'copë'},{k:'k10',l:'Klemë 10 mm²',u:'copë'},{k:'k16',l:'Klemë 16 mm²',u:'copë'},{k:'k25',l:'Klemë 25 mm²',u:'copë'}]},
    {t:'Tel 1.5 mm²',items:wire('t15','1.5 mm²',[['blu','blu',BL],['zi','i zi',Z],['kuq','i kuq',KU],['kaf','kafe',KA],['gri','gri',GR]])},
    {t:'Tel 2.5 mm²',items:wire('t25','2.5 mm²',[['blu','blu',BL],['ver','i verdhë',VE],['zi','i zi',Z]])},
    {t:'Tel 4 mm²',items:wire('t4','4 mm²',[['zi','i zi',Z],['blu','blu',BL],['ver','i verdhë',VE]])},
    {t:'Tel 10 mm²',items:wire('t10','10 mm²',[['zi','i zi',Z],['blu','blu',BL],['ver','i verdhë',VE]])}
  ];
  var G3=[
    {t:'Tuba',items:[{k:'tb20',l:'Tub φ20 ',u:'m'},{k:'tb25',l:'Tub φ25 ',u:'m'},{k:'tb32',l:'Tub φ32 ',u:'m'}]},
    {t:'Kuti çelësi',items:[{k:'kc3',l:'Kuti çelësi 3M',u:'copë'},{k:'kc4',l:'Kuti çelësi 4M',u:'copë'},{k:'kc6',l:'Kuti çelësi 6M',u:'copë'}]},
    {t:'Kuti shpërndarëse',items:[{k:'ks4',l:'Kuti shpërndarëse PT4',u:'copë'},{k:'ks5',l:'Kuti shpërndarëse PT5',u:'copë'},{k:'ks6',l:'Kuti shpërndarëse PT6',u:'copë'},{k:'ks7',l:'Kuti shpërndarëse PT7',u:'copë'}]},
    {t:'Kuti automatesh',items:[{k:'kau',pre:'Kuti automatesh',post:'M',u:'copë',vr:1}]}
  ];
  var TITLES=['Grupi 1 · çelësa dhe priza','Grupi 2 · automatë, klema, tela','Grupi 3 · tuba dhe kuti'];

  /* ---------- gjendja ---------- */
  var D={people:[],act:'',custom:{g1:[],g2:[],g3:[]},hidden:{}};
  var tv='sum';/* çfarë shfaqet te Totali: 'sum', 'each' ose id personi */
  var view='';/* id e personit ose 'total' */
  function uid(){return 'p'+Date.now().toString(36)+Math.random().toString(36).slice(2,5)}
  function newPerson(name){return {id:uid(),name:name,c:{},v:{}}}
  function norm(){
    D.hidden=D.hidden||{};D.custom=D.custom||{};['g1','g2','g3'].forEach(function(g){if(!Array.isArray(D.custom[g]))D.custom[g]=[]});
    if(!Array.isArray(D.people))D.people=[];
    if(!D.people.length){D.people.push(newPerson('Personi 1'));D.act=D.people[0].id}
    D.people.forEach(function(p){p.c=p.c||{};p.v=p.v||{}});
    if(!find(D.act))D.act=D.people[0].id;
    D.updated=D.updated||0;
  }
  /* ruajtja lokale: IndexedDB (si te faqja Kutitë), me kujtesë të përkohshme nëse nuk punon */
  var db=null,mem=false;
  function openDB(cb){
    try{
      var r=indexedDB.open('materialet',1);
      r.onupgradeneeded=function(){r.result.createObjectStore('k')};
      r.onsuccess=function(){db=r.result;cb()};
      r.onerror=function(){mem=true;cb()};
    }catch(e){mem=true;cb()}
  }
  function idbPut(){
    if(!db){if(mem&&!saveFail){saveFail=true;toast('Ruajtja në këtë shfletues nuk punon')}return}
    try{db.transaction('k','readwrite').objectStore('k').put(D,'state')}catch(e){}
  }
  var saveFail=false;
  function save(){D.updated=Date.now();idbPut();push()}
  function load(cb){
    function fin(){norm();view=D.act;cb()}
    if(!db)return fin();
    try{
      var q=db.transaction('k').objectStore('k').get('state');
      q.onsuccess=function(){
        var v=q.result;
        if(v&&Array.isArray(v.people))D=v;
        else{/* kalo të dhënat e vjetra nga versioni i parë (localStorage) */
          try{var o=JSON.parse(localStorage.getItem(KEY)||'null');if(o&&Array.isArray(o.people)){D=o;D.updated=Date.now()}}catch(e){}
        }
        fin();
      };
      q.onerror=fin;
    }catch(e){fin()}
  }
  function find(id){for(var i=0;i<D.people.length;i++)if(D.people[i].id===id)return D.people[i];return null}
  function cur(){return find(view)}
  function target(){return view==='total'?(find(tv)||null):find(view)}/* personi i shfaqur, ose null = shuma e të gjithëve */
  function num(s){var n=parseFloat(String(s).replace(',','.'));return isFinite(n)&&n>0?Math.round(n*100)/100:0}
  function fmt(n){return String(Math.round(n*100)/100).replace('.',',')}
  function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
  function vrows(p,k){var a=p.v[k];if(!a||!a.length){a=p.v[k]=[{v:'',n:0}]}return a}

  /* katalogu: lista fikse + materialet e shtuara nga ti */
  function cat(all){
    var c=D.custom,H=D.hidden||{};
    function keep(g,kf){
      var o=[];
      g.forEach(function(sec){
        var it=sec.items.filter(function(x){return all||!H[kf(x)]});
        if(it.length){var n={};for(var q in sec)n[q]=sec[q];n.items=it;o.push(n)}
      });
      return o;
    }
    var a=G1.slice(),b=G2.slice(),d=G3.slice();
    if(c.g1.length)a.push({t:'Të shtuara',c:'c-oth',cu:1,items:c.g1.map(function(x){return [x.k,x.l]})});
    if(c.g2.length)b.push({t:'Të shtuara',cu:1,items:c.g2.map(function(x){return {k:x.k,l:x.l,u:x.u,cu:1}})});
    if(c.g3.length)d.push({t:'Të shtuara',cu:1,items:c.g3.map(function(x){return {k:x.k,l:x.l,u:x.u,cu:1}})});
    var f1=function(x){return x[0]},f2=function(x){return x.k};
    return [keep(a,f1),keep(b,f2),keep(d,f2)];
  }

  /* ---------- vizatimi ---------- */
  function chips(){
    var inT=view==='total',o='<option value="" disabled hidden'+(inT?' selected':'')+'>Personat ▾</option>';
    D.people.forEach(function(p){o+='<option value="'+p.id+'"'+(!inT&&view===p.id?' selected':'')+'>'+esc(p.name)+'</option>'});
    o+='<option value="__add">+ Person i ri…</option>';
    $('selP').innerHTML=o;$('selP').className=inT?'':'act';
    if(!find(tv))tv=D.people[0].id;
    var t='<option value="" disabled hidden'+(!inT?' selected':'')+'>Totalet ▾</option>';
    D.people.forEach(function(p){t+='<option value="'+p.id+'"'+(inT&&tv===p.id?' selected':'')+'>Σ '+esc(p.name)+'</option>'});
    $('selT').innerHTML=t;$('selT').className=inT?'act':'';
  }
  function render(){
    chips();
    var m=$('main');
    if(view==='total'){m.innerHTML=renderTotal();return}
    var p=cur(),h='';
    var C=cat();
    h+='<h2 class="g">'+TITLES[0]+'</h2><p class="hint">Prek një pllakë për +1. Butoni − heq një.</p>';
    C[0].forEach(function(g){
      h+='<h3>'+g.t+'</h3><div class="tiles'+(g.c==='c-sup'?' t3':'')+'">';
      g.items.forEach(function(it){var n=p.c[it[0]]||0;
        h+='<div class="tile '+g.c+(n?' on':'')+'" data-t="'+it[0]+'" role="button" tabindex="0"><span class="tl">'+esc(it[1])+'</span><span class="tn'+(n?'':' z')+'">'+fmt(n)+'</span><button class="mn" data-m="'+it[0]+'" aria-label="Hiq një">−</button>'+(g.cu?'<button class="dx" data-dx="'+it[0]+'" aria-label="Fshi materialin">✕</button>':'')+'</div>';
      });
      h+='</div>';
    });
    h+='<button class="addm" data-nm="g1">+ Shto material te grupi 1</button>';
    h+='<h2 class="g">'+TITLES[1]+'</h2>'+sections(C[1],p)+'<button class="addm" data-nm="g2">+ Shto material te grupi 2</button>';
    h+='<h2 class="g">'+TITLES[2]+'</h2>'+sections(C[2],p)+'<button class="addm" data-nm="g3">+ Shto material te grupi 3</button>';
    h+='<div class="pact"><button data-pr="1" style="flex-basis:100%">✎ Ndrysho emrin e personit</button><button class="dng" data-pz="1">Vendos gjithçka në zero</button>'+(D.people.length>1?'<button class="dng" data-pd="1">Fshi personin</button>':'')+'</div>';
    m.innerHTML=h;
  }
  function sections(G,p){
    return G.map(function(g){
      var h='<h3>'+g.t+'</h3><div class="list">';
      g.items.forEach(function(it){
        if(it.vr){
          var a=vrows(p,it.k);
          a.forEach(function(r,i){
            h+='<div class="row'+(r.n?' on':'')+'" data-vk="'+it.k+'" data-i="'+i+'"><span class="rl">'+it.pre+' <input class="vi" data-f="v" type="text" inputmode="'+(it.post==='A'?'decimal':'numeric')+'" placeholder="__" value="'+esc(r.v)+'"> '+it.post+'</span>'+
              '<div class="u"><input data-f="n" type="text" inputmode="numeric" placeholder="0" value="'+(r.n?fmt(r.n):'')+'"><span>'+it.u+'</span></div>'+
              (a.length>1?'<button class="x" data-del="1" aria-label="Fshi rreshtin">✕</button>':'')+'</div>';
          });
          h+='<button class="addv" data-add="'+it.k+'">+ '+it.pre+' me vlerë tjetër</button>';
        }else{
          var n=p.c[it.k]||0;
          h+='<div class="row'+(n?' on':'')+'"><span class="rl">'+(it.dot?'<i class="dot" style="background:'+it.dot+'"></i>':'')+esc(it.l)+'</span>'+
            '<div class="u"><input data-k="'+it.k+'" type="text" inputmode="'+(it.u==='m'?'decimal':'numeric')+'" placeholder="0" value="'+(n?fmt(n):'')+'"><span>'+it.u+'</span></div>'+(it.cu?'<button class="x" data-dx="'+it.k+'" aria-label="Fshi materialin">✕</button>':'')+'</div>';

  /* ---------- listat e përmbledhura (për totalin dhe tekstin) ---------- */
  /* kthen [{grup, rreshta:[{l,n,u}]}] për një listë personash */
  function collect(people){
    var out=[],acc={},vacc={},C=cat();
    function add(k,n){if(n)acc[k]=(acc[k]||0)+n}
    people.forEach(function(p){
      Object.keys(p.c).forEach(function(k){add(k,p.c[k])});
      Object.keys(p.v).forEach(function(k){(p.v[k]||[]).forEach(function(r){if(!r.n)return;var key=k+'|'+String(r.v).trim();vacc[key]=(vacc[key]||0)+r.n})});
    });
    var g1=[];
    C[0].forEach(function(g){g.items.forEach(function(it){if(acc[it[0]])g1.push({l:it[2]||it[1],n:acc[it[0]],u:'copë'})})});
    out.push({t:TITLES[0],r:g1});
    [[C[1],TITLES[1]],[C[2],TITLES[2]]].forEach(function(x){
      var rr=[];
      x[0].forEach(function(g){g.items.forEach(function(it){
        if(it.vr){
          Object.keys(vacc).filter(function(key){return key.split('|')[0]===it.k}).sort(function(a,b){return parseFloat(a.split('|')[1])-parseFloat(b.split('|')[1])||0}).forEach(function(key){
            var v=key.split('|')[1];rr.push({l:it.pre+' '+(v||'?')+' '+it.post,n:vacc[key],u:it.u});
          });
        }else if(acc[it.k])rr.push({l:it.full||it.l,n:acc[it.k],u:it.u});
      })});
      out.push({t:x[1],r:rr});
    });
    return out;
  }

    });
    return any?h:'<div class="empty">Asnjë material i shënuar.</div>';
  }

  /* ---------- eksport: PDF / JPEG (pa biblioteka, punon edhe pa internet) ---------- */
  var W=1240,PH=1754,M=90;
  function layout(data,title,paged){
    var pages=[[]],y=M,RH=58,GH=84;
    function put(it,need){
      if(paged&&y+(need||it.h)>PH-M&&pages[pages.length-1].length){pages.push([]);y=M}
      it.y=y;pages[pages.length-1].push(it);y+=it.h;
    }
    put({k:'title',t:title,h:70});
    put({k:'date',t:(function(d){return d.getDate()+' '+['janar','shkurt','mars','prill','maj','qershor','korrik','gusht','shtator','tetor','nëntor','dhjetor'][d.getMonth()]+' '+d.getFullYear()})(new Date()),h:70});
    var any=false;
    data.forEach(function(g){
      if(!g.r.length)return;any=true;
      put({k:'grp',t:g.t,h:GH},GH+RH);
      g.r.forEach(function(r){put({k:'row',r:r,h:RH})});
    });
    if(!any)put({k:'none',t:'Nuk ka materiale të shënuar.',h:RH});
    return {pages:pages,height:y+M};
  }
  function draw(pg,h,title){
    var c=document.createElement('canvas');c.width=W;c.height=h;var x=c.getContext('2d');
    x.fillStyle='#fff';x.fillRect(0,0,W,h);x.textBaseline='alphabetic';
    var F='system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif';
    pg.forEach(function(it){
      if(it.k==='title'){x.fillStyle='#111';x.font='700 46px '+F;x.textAlign='left';x.fillText(it.t,M,it.y+46)}
      else if(it.k==='date'){x.fillStyle='#777';x.font='400 26px '+F;x.textAlign='left';x.fillText(it.t,M,it.y+14)}
      else if(it.k==='grp'){x.fillStyle='#1a6ef0';x.font='700 28px '+F;x.textAlign='left';x.fillText(it.t.toUpperCase(),M,it.y+50);x.fillRect(M,it.y+62,W-2*M,3)}
      else if(it.k==='none'){x.fillStyle='#777';x.font='400 30px '+F;x.textAlign='left';x.fillText(it.t,M,it.y+38)}
      else{
        x.fillStyle='#111';x.font='400 32px '+F;x.textAlign='left';x.fillText(it.r.l,M,it.y+38);
        x.font='700 32px '+F;x.textAlign='right';x.fillText(fmt(it.r.n)+' '+it.r.u,W-M,it.y+38);
        x.fillStyle='#e2e2de';x.fillRect(M,it.y+52,W-2*M,1);
      }
    });
    return c;
  }
  function b64bytes(url){var b=atob(url.split(',')[1]),u=new Uint8Array(b.length);for(var i=0;i<b.length;i++)u[i]=b.charCodeAt(i);return u}
  function makePdf(canvases){
    var parts=[],off=0,xr=[],enc=new TextEncoder();
    function w(v){var b=typeof v==='string'?enc.encode(v):v;parts.push(b);off+=b.length}
    function o(n){xr[n]=off;w(n+' 0 obj\n')}
    var n=canvases.length,kids=[];for(var i=0;i<n;i++)kids.push((3+3*i)+' 0 R');
    w('%PDF-1.4\n');
    o(1);w('<< /Type /Catalog /Pages 2 0 R >>\nendobj\n');
    o(2);w('<< /Type /Pages /Kids ['+kids.join(' ')+'] /Count '+n+' >>\nendobj\n');
    canvases.forEach(function(c,i){
      var jb=b64bytes(c.toDataURL('image/jpeg',0.92)),pn=3+3*i,cs='q 595 0 0 842 0 0 cm /Im0 Do Q';
      o(pn);w('<< /Type /Page /Parent 2 0 R /MediaBox [0 0 595 842] /Resources << /XObject << /Im0 '+(pn+2)+' 0 R >> >> /Contents '+(pn+1)+' 0 R >>\nendobj\n');
      o(pn+1);w('<< /Length '+cs.length+' >>\nstream\n'+cs+'\nendstream\nendobj\n');
      o(pn+2);w('<< /Type /XObject /Subtype /Image /Width '+c.width+' /Height '+c.height+' /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length '+jb.length+' >>\nstream\n');w(jb);w('\nendstream\nendobj\n');
    });
    var total=3+3*n,xo=off,x='xref\n0 '+total+'\n0000000000 65535 f \n';
    for(var k=1;k<total;k++)x+=('0000000000'+xr[k]).slice(-10)+' 00000 n \n';
    w(x+'trailer\n<< /Size '+total+' /Root 1 0 R >>\nstartxref\n'+xo+'\n%%EOF');
    return new Blob(parts,{type:'application/pdf'});
  }
  function saveBlob(blob,name){
    var u=URL.createObjectURL(blob),l=document.createElement('a');
    l.href=u;l.download=name;document.body.appendChild(l);l.click();document.body.removeChild(l);
    setTimeout(function(){URL.revokeObjectURL(u)},4000);
  }
  function doExport(p,f){
    var data=collect(p?[p]:D.people),title='Materialet — '+(p?p.name:'Totali');
    var fn='Materialet-'+(p?p.name:'Totali').replace(/[^\w\u00C0-\u024F-]+/g,'_');
    try{
      if(f==='pdf'){
        var L=layout(data,title,true),cs=L.pages.map(function(pg){return draw(pg,PH,title)});
        saveBlob(makePdf(cs),fn+'.pdf');
      }else{
        var L2=layout(data,title,false),c=draw(L2.pages[0],L2.height,title);
        c.toBlob(function(b){saveBlob(b,fn+'.jpg')},'image/jpeg',0.92);
      }
      toast(f==='pdf'?'PDF u përgatit…':'JPEG u përgatit…');
    }catch(e){toast('Nuk u krijua skedari')}
  }

  /* ---------- sinkronizim Firebase (i njëjti llogari/projekt si faqja Kutitë) ---------- */
  var user=null,fbReady=null,pt=null,busy=false;
  function cfgOk(){return !!(window.FIREBASE_CONFIG&&FIREBASE_CONFIG.apiKey)}
  function setSt(t){$('st').textContent=t}
  function loadJs(u){return new Promise(function(res,rej){var e=document.createElement('script');e.src=u;e.onload=res;e.onerror=rej;document.head.appendChild(e)})}
  function initFb(){
    if(fbReady)return fbReady;
    var v='https://www.gstatic.com/firebasejs/10.12.2/firebase-';
    fbReady=loadJs(v+'app-compat.js').then(function(){return Promise.all([loadJs(v+'auth-compat.js'),loadJs(v+'firestore-compat.js')])}).then(function(){
      firebase.initializeApp(FIREBASE_CONFIG);
      return new Promise(function(res){
        firebase.auth().onAuthStateChanged(function(u){user=u;res();if(u)pull();else setSt('· pa hyrë')});
      });
    }).catch(function(){fbReady=null;setSt('· pa lidhje me cloud')});
    return fbReady;
  }
  /* dokumenti: users/{uid}/chunks/materialet (nën të njëjtin përdorues si Kutitë) */
  function ref(){return firebase.firestore().collection('users').doc(user.uid).collection('chunks').doc('materialet')}
  function push(){
    if(!cfgOk()||!user)return;
    clearTimeout(pt);setSt('· pa sinkronizuar');pt=setTimeout(doPush,1500);
  }
  function doPush(){
    if(!cfgOk()||!user)return;
    if(busy){pt=setTimeout(doPush,1500);return}
    busy=true;setSt('· po dërgohet…');
    var pay=JSON.stringify({people:D.people,custom:D.custom,hidden:D.hidden});
    ref().set({d:pay,updated:D.updated}).then(function(){setSt('· u sinkronizua ✓')}).catch(function(){setSt('· gabim sinkronizimi')}).then(function(){busy=false});
  }
  function pull(force){
    if(!cfgOk()||!user)return Promise.resolve();
    setSt('· po kontrollohet…');
    return ref().get().then(function(snap){
      if(!snap.exists){if(D.updated)doPush();else setSt('· cloud bosh');return}
      var r=snap.data(),ru=r.updated||0;
      if(!(force===true||ru>D.updated)){if(ru<D.updated)doPush();else setSt('· u sinkronizua ✓');return}
      var o=JSON.parse(r.d||'{}'),act=D.act;
      D={people:o.people||[],custom:o.custom,hidden:o.hidden,act:act,updated:ru};
      norm();if(view!=='total'&&!find(view))view=D.act;
      idbPut();render();setSt('· u sinkronizua ✓');
    }).catch(function(){setSt('· gabim sinkronizimi')});
  }
  function syncSheet(){
    var h='<h2>Sinkronizim (cloud)</h2><p class="hint">Të njëjtën llogari si te faqja Kutitë. Materialet ruhen në cloud dhe shfaqen në çdo pajisje ku hyn.</p>';
    if(!cfgOk())h+='<p class="hint">Firebase nuk është konfiguruar.</p>';
    else if(user)h+='<p class="hint"><b>Hyrë si '+esc(user.email||'përdorues')+'</b></p><button data-a="cpull">Shkarko nga cloud</button><button class="dng" data-a="cout">Dil</button>';
    else h+='<p class="hint">Nuk ke hyrë. Hyr me email dhe fjalëkalim.</p><input class="nm" id="uE" type="email" placeholder="Email" autocomplete="email" autocapitalize="off" inputmode="email"><div style="height:6px"></div><input class="nm" id="uP" type="password" placeholder="Fjalëkalimi" autocomplete="current-password"><div style="height:8px"></div><button class="pri" data-a="cin" style="text-align:center">Hyr</button><button data-a="cres">Harrova fjalëkalimin</button>';
    h+='<button data-a="menu">‹ Mbrapa</button>';
    showSheet(h);
  }
  function authMsg(x){
    var m={'auth/invalid-email':'Email-i nuk është i vlefshëm.','auth/invalid-credential':'Email ose fjalëkalim i gabuar.','auth/wrong-password':'Fjalëkalim i gabuar.','auth/user-not-found':'Nuk ekziston llogari me këtë email.','auth/too-many-requests':'Shumë përpjekje. Provo pas pak.','auth/network-request-failed':'Nuk ka lidhje me internetin.'};
    return m[x&&x.code]||('Gabim: '+(x&&x.code?x.code:x));
  }
  function authGo(kind){
    var e=$('uE').value.trim(),pw=$('uP').value;
    if(!e||(!pw&&kind!=='res')){alert('Shkruaj email-in'+(kind==='res'?'.':' dhe fjalëkalimin.'));return}
    var go=function(){
      if(!window.firebase){alert('Nuk ka lidhje me internetin.');return}
      var a=firebase.auth(),pr=kind==='res'?a.sendPasswordResetEmail(e):a.signInWithEmailAndPassword(e,pw);
      pr.then(function(){
        if(kind==='res')alert('Të dërgova lidhjen për fjalëkalim të ri në email (shiko edhe te Spam).');else closeSheet();
      }).catch(function(x){alert(authMsg(x))});
    };
    if(window.firebase&&firebase.apps&&firebase.apps.length)go();else initFb().then(go);
  }
  document.addEventListener('visibilitychange',function(){if(!document.hidden)pull()});

  openDB(function(){load(function(){render();if(cfgOk())initFb()})});
  if('serviceWorker' in navigator)window.addEventListener('load',function(){navigator.serviceWorker.register('sw.js').catch(function(){})});
})();
</script>
</body>
</html>
