<!DOCTYPE html>
<html lang="sq">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Materialet</title>
<meta name="theme-color" content="#1a6ef0">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Materialet">
<style>
:root{--bg:#f4f4f2;--surf:#fff;--text:#1c1c1a;--mut:#6b6b66;--bd:#d8d8d2;--acc:#1a6ef0;--cel:#e66a00;--pri:#1a6ef0;--sup:#8a3ffc;--danger:#d23b3b;--ok:#1f9d55}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#141413;--surf:#222220;--text:#f0f0ec;--mut:#a0a09a;--bd:#3a3a36;--acc:#5b9bff;--pri:#5b9bff;--sup:#b388ff;--danger:#ff6b6b}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text);font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
body{padding-bottom:calc(40px + env(safe-area-inset-bottom,0px))}
button{font:inherit;color:var(--text);background:var(--surf);border:1px solid var(--bd);border-radius:10px;padding:8px 12px;cursor:pointer}
button.pri{background:var(--acc);border-color:var(--acc);color:#fff}

.top{position:sticky;top:0;z-index:10;background:var(--surf);border-bottom:1px solid var(--bd);padding-top:env(safe-area-inset-top,0px)}
.bar{display:flex;align-items:center;gap:8px;padding:8px 10px}
.bar h1{flex:1;margin:0;font-size:16px}
.bar a.back{text-decoration:none;color:var(--text);border:1px solid var(--bd);border-radius:10px;padding:6px 12px;font-size:18px;line-height:1.2}
.bar button{padding:6px 12px;font-size:18px;line-height:1.2}
.chips{display:flex;gap:6px;overflow-x:auto;padding:0 10px 8px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border-radius:999px;padding:6px 14px;font-size:14px;white-space:nowrap}
.chip.on{background:var(--acc);border-color:var(--acc);color:#fff;font-weight:600}
.chip.add{border-style:dashed;color:var(--mut)}

main{max-width:640px;margin:0 auto;padding:12px 10px}
h2.g{margin:22px 0 4px;font-size:13px;letter-spacing:.06em;text-transform:uppercase;color:var(--mut)}
h2.g:first-child{margin-top:4px}
h3{margin:14px 0 6px;font-size:15px;display:flex;align-items:center;gap:8px}
.hint{font-size:13px;color:var(--mut);margin:0 0 8px}

/* grupi 1: pllaka që prek për +1 */
.tiles{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
@media(min-width:480px){.tiles{grid-template-columns:repeat(3,1fr)}}
.tile{position:relative;display:flex;flex-direction:column;justify-content:space-between;min-height:88px;padding:10px 12px;text-align:left;background:var(--surf);border:1px solid var(--bd);border-left:5px solid var(--gc);border-radius:12px;user-select:none;-webkit-user-select:none;touch-action:manipulation;transition:transform .08s}
.tile:active{transform:scale(.96)}
.tile.on{border-color:var(--gc);box-shadow:0 0 0 1px var(--gc) inset}
.tile .tl{font-size:14px;line-height:1.2;padding-right:34px}
.tile .tn{font-size:34px;font-weight:700;line-height:1;color:var(--gc);font-variant-numeric:tabular-nums}
.tile .tn.z{color:var(--mut);opacity:.5}
.tile .mn{position:absolute;right:6px;top:6px;width:32px;height:32px;padding:0;border-radius:50%;font-size:20px;line-height:1;color:var(--mut)}
.tile .mn:active{background:var(--bg)}
.c-cel{--gc:var(--cel)}.c-pri{--gc:var(--pri)}.c-sup{--gc:var(--sup)}

/* grupi 2 dhe 3: listë me numra */
.list{background:var(--surf);border:1px solid var(--bd);border-radius:12px;overflow:hidden}
.row{display:flex;align-items:center;gap:8px;padding:6px 10px;border-bottom:1px solid var(--bd);min-height:50px}
.row:last-child{border-bottom:0}
.row.on{background:color-mix(in srgb,var(--acc) 9%,var(--surf))}
.rl{flex:1;min-width:0;display:flex;align-items:center;gap:7px;font-size:15px}
.dot{width:14px;height:14px;border-radius:50%;border:1px solid rgba(128,128,128,.55);flex:none}
.u{position:relative;flex:none;width:104px}
.u input{width:100%;font:inherit;font-size:17px;font-weight:600;text-align:right;padding:7px 46px 7px 8px;border:1px solid var(--bd);border-radius:10px;background:var(--bg);color:var(--text);font-variant-numeric:tabular-nums}
.u span{position:absolute;right:9px;top:50%;transform:translateY(-50%);font-size:12px;color:var(--mut);pointer-events:none}
input:focus{outline:2px solid var(--acc);outline-offset:-1px}
input.vi{width:54px;font:inherit;font-size:15px;font-weight:600;text-align:center;padding:5px 4px;border:1px solid var(--bd);border-radius:8px;background:var(--bg);color:var(--text)}
.x{width:30px;height:30px;padding:0;border-radius:50%;color:var(--mut);flex:none;font-size:16px;line-height:1}
.addv{display:block;width:100%;border:0;border-top:1px dashed var(--bd);border-radius:0;background:transparent;color:var(--acc);font-size:14px;padding:9px}

/* totali */
.sum .row{min-height:44px}
.sum b{font-variant-numeric:tabular-nums;font-size:17px}
.sum .row span.unit{color:var(--mut);font-size:13px;margin-left:4px;font-weight:400}
.empty{color:var(--mut);text-align:center;padding:30px 10px}

/* meny */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:30;display:none}
.sheet{position:fixed;left:0;right:0;bottom:0;max-width:560px;margin:0 auto;z-index:31;background:var(--surf);border:1px solid var(--bd);border-bottom:0;border-radius:14px 14px 0 0;padding:10px 12px calc(10px + env(safe-area-inset-bottom,0px));display:none;box-shadow:0 -4px 20px rgba(0,0,0,.25)}
.sheet h2{margin:0 0 8px;font-size:15px}
.sheet button{display:block;width:100%;text-align:left;margin-bottom:6px;padding:11px 12px}
.sheet button.dng{color:var(--danger)}
#toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:40;background:#1c1c1a;color:#fff;padding:9px 16px;border-radius:999px;font-size:14px;opacity:0;pointer-events:none;transition:opacity .2s;max-width:90%;text-align:center}
#toast.show{opacity:1}
</style>
</head>
<body>
<div class="top">
  <div class="bar">
    <a class="back" href="index.html" aria-label="Kreu">‹</a>
    <h1>Materialet</h1>
    <button id="bMenu" aria-label="Menyja">⋯</button>
  </div>
  <div class="chips" id="chips"></div>
</div>
<main id="main"></main>

<div class="scrim" id="scrim"></div>
<div class="sheet" id="sheet"></div>
<div id="toast"></div>
<input type="file" id="file" accept="application/json,.json" hidden>

<script>
(function(){
  var $=function(i){return document.getElementById(i)};
  var KEY='materialet1';

  /* ---------- lista e materialeve ---------- */
  /* grupi 1: prek për +1 */
  var G1=[
    {t:'Çelësa',c:'c-cel',items:[['c_thj','Çelës i thjeshtë'],['c_dev','Devijator'],['c_inv','Invertitor'],['c_01','Çelës 0-1']]},
    {t:'Priza',c:'c-pri',items:[['p_shu','Prizë shuko'],['p_biv','Prizë bivalente'],['p_tv','Prizë TV'],['p_net','Prizë interneti']]},
    {t:'Suporte + kapakë',c:'c-sup',items:[['s3','3M','Suport + kapak 3M'],['s4','4M','Suport + kapak 4M'],['s6','6M','Suport + kapak 6M']]}
  ];
  function wire(pref,mm,cols,unit){return cols.map(function(c){return {k:pref+'_'+c[0],l:c[1],full:'Tel '+mm+' '+c[1],u:'m',dot:c[2]}})}
  var Z='#1c1c1a',BL='#1a6ef0',KU='#d23b3b',KA='#8b5a2b',GR='#9a9a96',VE='#f2c200';
  /* grupet 2 dhe 3: shkruaj numrin (copë ose metra) */
  var G2=[
    {t:'Automatë',items:[
      {k:'a10',l:'Automat 10 A',u:'copë'},{k:'a16',l:'Automat 16 A',u:'copë'},{k:'a20',l:'Automat 20 A',u:'copë'},
      {k:'salva',pre:'Salva Vita',post:'A',u:'copë',vr:1},
      {k:'rreg',l:'Rregullator tensioni',u:'copë'},{k:'ure',l:'Urë automatesh',u:'copë'}]},
    {t:'Klema',items:[{k:'k6',l:'Klemë 6 mm',u:'copë'},{k:'k10',l:'Klemë 10 mm',u:'copë'},{k:'k16',l:'Klemë 16 mm',u:'copë'},{k:'k25',l:'Klemë 25 mm',u:'copë'}]},
    {t:'Tel 1.5',items:wire('t15','1.5',[['blu','blu',BL],['zi','i zi',Z],['kuq','i kuq',KU],['kaf','kafe',KA],['gri','gri',GR]])},
    {t:'Tel 2.5',items:wire('t25','2.5',[['blu','blu',BL],['ver','i verdhë',VE],['zi','i zi',Z]])},
    {t:'Tel 4 mm',items:wire('t4','4 mm',[['zi','i zi',Z],['blu','blu',BL],['ver','i verdhë',VE]])},
    {t:'Tel 10 mm',items:wire('t10','10 mm',[['zi','i zi',Z],['blu','blu',BL],['ver','i verdhë',VE]])}
  ];
  var G3=[
    {t:'Tuba',items:[{k:'tb20',l:'Tub 20 mm',u:'m'},{k:'tb25',l:'Tub 25 mm',u:'m'},{k:'tb32',l:'Tub 32 mm',u:'m'}]},
    {t:'Kuti çelësi',items:[{k:'kc3',l:'Kuti çelësi 3M',u:'copë'},{k:'kc4',l:'Kuti çelësi 4M',u:'copë'},{k:'kc6',l:'Kuti çelësi 6M',u:'copë'}]},
    {t:'Kuti shpërndarëse',items:[{k:'ks4',l:'Kuti shpërndarëse PT4',u:'copë'},{k:'ks5',l:'Kuti shpërndarëse PT5',u:'copë'},{k:'ks6',l:'Kuti shpërndarëse PT6',u:'copë'},{k:'ks7',l:'Kuti shpërndarëse PT7',u:'copë'}]},
    {t:'Kuti automatesh',items:[{k:'kau',pre:'Kuti automatesh',post:'M',u:'copë',vr:1}]}
  ];
  var TITLES=['Grupi 1 · çelësa dhe priza','Grupi 2 · automatë, klema, tela','Grupi 3 · tuba dhe kuti'];

  /* ---------- gjendja ---------- */
  var D={people:[],act:''};
  var view='';/* id e personit ose 'total' */
  function uid(){return 'p'+Date.now().toString(36)+Math.random().toString(36).slice(2,5)}
  function newPerson(name){return {id:uid(),name:name,c:{},v:{}}}
  function load(){
    try{var s=JSON.parse(localStorage.getItem(KEY)||'null');if(s&&Array.isArray(s.people))D=s}catch(e){}
    if(!D.people.length){D.people.push(newPerson('Personi 1'));D.act=D.people[0].id}
    D.people.forEach(function(p){p.c=p.c||{};p.v=p.v||{}});
    if(!find(D.act))D.act=D.people[0].id;
    view=D.act;
  }
  var saveFail=false;
  function save(){try{localStorage.setItem(KEY,JSON.stringify(D))}catch(e){if(!saveFail){saveFail=true;toast('Nuk mund të ruaj në këtë shfletues')}}}
  function find(id){for(var i=0;i<D.people.length;i++)if(D.people[i].id===id)return D.people[i];return null}
  function cur(){return find(view)}
  function num(s){var n=parseFloat(String(s).replace(',','.'));return isFinite(n)&&n>0?Math.round(n*100)/100:0}
  function fmt(n){return String(Math.round(n*100)/100).replace('.',',')}
  function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
  function vrows(p,k){var a=p.v[k];if(!a||!a.length){a=p.v[k]=[{v:'',n:0}]}return a}

  /* ---------- vizatimi ---------- */
  function chips(){
    var h=D.people.map(function(p){return '<button class="chip'+(view===p.id?' on':'')+'" data-p="'+p.id+'">'+esc(p.name)+'</button>'}).join('');
    h+='<button class="chip'+(view==='total'?' on':'')+'" data-p="total">Totali</button><button class="chip add" id="bAdd">+ Person</button>';
    $('chips').innerHTML=h;
    var on=$('chips').querySelector('.on');if(on&&on.scrollIntoView)on.scrollIntoView({inline:'center',block:'nearest'});
  }
  function render(){
    chips();
    var m=$('main');
    if(view==='total'){m.innerHTML=renderTotal();return}
    var p=cur(),h='';
    h+='<h2 class="g">'+TITLES[0]+'</h2><p class="hint">Prek një pllakë për +1. Butoni − heq një.</p>';
    G1.forEach(function(g){
      h+='<h3>'+g.t+'</h3><div class="tiles">';
      g.items.forEach(function(it){var n=p.c[it[0]]||0;
        h+='<div class="tile '+g.c+(n?' on':'')+'" data-t="'+it[0]+'" role="button" tabindex="0"><span class="tl">'+esc(it[1])+'</span><span class="tn'+(n?'':' z')+'">'+fmt(n)+'</span><button class="mn" data-m="'+it[0]+'" aria-label="Hiq një">−</button></div>';
      });
      h+='</div>';
    });
    h+='<h2 class="g">'+TITLES[1]+'</h2>'+sections(G2,p);
    h+='<h2 class="g">'+TITLES[2]+'</h2>'+sections(G3,p);
    m.innerHTML=h;
  }
  function sections(G,p){
    return G.map(function(g){
      var h='<h3>'+g.t+'</h3><div class="list">';
      g.items.forEach(function(it){
        if(it.vr){
          var a=vrows(p,it.k);
          a.forEach(function(r,i){
            h+='<div class="row'+(r.n?' on':'')+'" data-vk="'+it.k+'" data-i="'+i+'"><span class="rl">'+it.pre+' <input class="vi" data-f="v" type="text" inputmode="'+(it.post==='A'?'decimal':'numeric')+'" placeholder="__" value="'+esc(r.v)+'"> '+it.post+'</span>'+
              '<div class="u"><input data-f="n" type="text" inputmode="numeric" placeholder="0" value="'+(r.n?fmt(r.n):'')+'"><span>'+it.u+'</span></div>'+
              (a.length>1?'<button class="x" data-del="1" aria-label="Fshi rreshtin">✕</button>':'')+'</div>';
          });
          h+='<button class="addv" data-add="'+it.k+'">+ '+it.pre+' me vlerë tjetër</button>';
        }else{
          var n=p.c[it.k]||0;
          h+='<div class="row'+(n?' on':'')+'"><span class="rl">'+(it.dot?'<i class="dot" style="background:'+it.dot+'"></i>':'')+esc(it.dot?it.l:it.l)+'</span>'+
            '<div class="u"><input data-k="'+it.k+'" type="text" inputmode="'+(it.u==='m'?'decimal':'numeric')+'" placeholder="0" value="'+(n?fmt(n):'')+'"><span>'+it.u+'</span></div></div>';
        }
      });
      return h+'</div>';
    }).join('');
  }

  /* ---------- listat e përmbledhura (për totalin dhe tekstin) ---------- */
  /* kthen [{grup, rreshta:[{l,n,u}]}] për një listë personash */
  function collect(people){
    var out=[],acc={},vacc={};
    function add(k,n){if(n)acc[k]=(acc[k]||0)+n}
    people.forEach(function(p){
      Object.keys(p.c).forEach(function(k){add(k,p.c[k])});
      Object.keys(p.v).forEach(function(k){(p.v[k]||[]).forEach(function(r){if(!r.n)return;var key=k+'|'+String(r.v).trim();vacc[key]=(vacc[key]||0)+r.n})});
    });
    var g1=[];
    G1.forEach(function(g){g.items.forEach(function(it){if(acc[it[0]])g1.push({l:it[2]||it[1],n:acc[it[0]],u:'copë'})})});
    out.push({t:TITLES[0],r:g1});
    [[G2,TITLES[1]],[G3,TITLES[2]]].forEach(function(x){
      var rr=[];
      x[0].forEach(function(g){g.items.forEach(function(it){
        if(it.vr){
          Object.keys(vacc).filter(function(key){return key.split('|')[0]===it.k}).sort(function(a,b){return parseFloat(a.split('|')[1])-parseFloat(b.split('|')[1])||0}).forEach(function(key){
            var v=key.split('|')[1];rr.push({l:it.pre+' '+(v||'?')+' '+it.post,n:vacc[key],u:it.u});
          });
        }else if(acc[it.k])rr.push({l:it.full||it.l,n:acc[it.k],u:it.u});
      })});
      out.push({t:x[1],r:rr});
    });
    return out;
  }
  function renderTotal(){
    var data=collect(D.people),any=data.some(function(g){return g.r.length}),h='';
    if(!any)return '<div class="empty">Ende nuk ka asnjë material të shënuar.</div>';
    h+='<p class="hint">Shuma për '+D.people.length+' '+(D.people.length===1?'person':'persona')+'.</p>';
    data.forEach(function(g){
      if(!g.r.length)return;
      h+='<h2 class="g">'+g.t+'</h2><div class="list sum">'+g.r.map(function(r){return '<div class="row"><span class="rl">'+esc(r.l)+'</span><b>'+fmt(r.n)+'<span class="unit">'+r.u+'</span></b></div>'}).join('')+'</div>';
    });
    return h;
  }
  function asText(){
    var p=view==='total'?null:cur(),data=collect(p?[p]:D.people);
    var t='Materialet — '+(p?p.name:'Totali ('+D.people.map(function(x){return x.name}).join(', ')+')')+'\n';
    var any=false;
    data.forEach(function(g){
      if(!g.r.length)return;any=true;
      t+='\n'+g.t+'\n'+g.r.map(function(r){return '- '+r.l+': '+fmt(r.n)+' '+r.u}).join('\n')+'\n';
    });
    return any?t:null;
  }

  /* ---------- veprime ---------- */
  var tt;
  function toast(m){var e=$('toast');e.textContent=m;e.classList.add('show');clearTimeout(tt);tt=setTimeout(function(){e.classList.remove('show')},1800)}
  function buzz(){try{navigator.vibrate&&navigator.vibrate(8)}catch(e){}}
  function bump(k,d){
    var p=cur();if(!p)return;
    var n=Math.max(0,(p.c[k]||0)+d);
    p.c[k]=n;save();
    var t=document.querySelector('.tile[data-t="'+k+'"]');
    if(t){t.classList.toggle('on',n>0);var e=t.querySelector('.tn');e.textContent=fmt(n);e.classList.toggle('z',!n)}
    buzz();
  }
  var main=$('main');
  main.addEventListener('click',function(e){
    var m=e.target.closest('.mn');
    if(m){e.stopPropagation();bump(m.getAttribute('data-m'),-1);return}
    var t=e.target.closest('.tile');
    if(t){bump(t.getAttribute('data-t'),1);return}
    var a=e.target.closest('[data-add]');
    if(a){var p=cur();vrows(p,a.getAttribute('data-add')).push({v:'',n:0});save();render();return}
    var d=e.target.closest('[data-del]');
    if(d){var row=d.closest('.row'),pp=cur(),arr=vrows(pp,row.getAttribute('data-vk'));arr.splice(+row.getAttribute('data-i'),1);if(!arr.length)arr.push({v:'',n:0});save();render()}
  });
  main.addEventListener('keydown',function(e){
    var t=e.target.closest&&e.target.closest('.tile');
    if(t&&e.target===t&&(e.key==='Enter'||e.key===' ')){e.preventDefault();bump(t.getAttribute('data-t'),1)}
  });
  main.addEventListener('input',function(e){
    var el=e.target,p=cur();if(!p)return;
    var row=el.closest('.row');
    if(el.hasAttribute('data-k')){
      var n=num(el.value);p.c[el.getAttribute('data-k')]=n;save();
      if(row)row.classList.toggle('on',n>0);
    }else if(el.getAttribute('data-f')){
      var r=row.getAttribute('data-vk'),i=+row.getAttribute('data-i'),o=vrows(p,r)[i];
      if(!o)return;
      if(el.getAttribute('data-f')==='v')o.v=el.value;else{o.n=num(el.value);row.classList.toggle('on',o.n>0)}
      save();
    }
  });
  main.addEventListener('focusin',function(e){var el=e.target;if(el.tagName==='INPUT')setTimeout(function(){try{el.select()}catch(x){}},0)});

  $('chips').addEventListener('click',function(e){
    var c=e.target.closest('.chip');if(!c)return;
    if(c.id==='bAdd'){
      var nm=prompt('Emri i personit:','Personi '+(D.people.length+1));
      if(nm===null)return;nm=nm.trim()||('Personi '+(D.people.length+1));
      var p=newPerson(nm);D.people.push(p);D.act=p.id;view=p.id;save();render();window.scrollTo(0,0);return;
    }
    view=c.getAttribute('data-p');if(view!=='total'){D.act=view;save()}
    render();window.scrollTo(0,0);
  });

  /* menyja */
  function closeSheet(){$('sheet').style.display='none';$('scrim').style.display='none'}
  function openSheet(){
    var p=cur(),h='<h2>'+(p?esc(p.name):'Totali')+'</h2>';
    h+='<button data-a="copy">Kopjo listën si tekst</button>';
    if(navigator.share)h+='<button data-a="share">Ndaj listën (WhatsApp, mesazh…)</button>';
    if(p){h+='<button data-a="ren">Ndrysho emrin</button><button data-a="zero" class="dng">Vendos gjithçka në zero</button>';
      if(D.people.length>1)h+='<button data-a="del" class="dng">Fshi personin</button>'}
    h+='<button data-a="bak">Ruaj kopje rezervë (skedar)</button><button data-a="res">Rikthe nga kopja rezervë</button>';
    $('sheet').innerHTML=h;$('sheet').style.display='block';$('scrim').style.display='block';
  }
  $('bMenu').onclick=openSheet;$('scrim').onclick=closeSheet;
  function copyText(t){
    if(navigator.clipboard&&navigator.clipboard.writeText){return navigator.clipboard.writeText(t).then(function(){toast('Lista u kopjua')},fb)}
    fb();
    function fb(){var ta=document.createElement('textarea');ta.value=t;ta.style.cssText='position:fixed;opacity:0';document.body.appendChild(ta);ta.select();try{document.execCommand('copy');toast('Lista u kopjua')}catch(e){toast('Nuk u kopjua')}document.body.removeChild(ta)}
  }
  $('sheet').addEventListener('click',function(e){
    var b=e.target.closest('button');if(!b)return;
    var a=b.getAttribute('data-a'),p=cur();closeSheet();
    if(a==='copy'||a==='share'){
      var t=asText();if(!t){toast('Nuk ka asgjë të shënuar');return}
      if(a==='copy')copyText(t);else navigator.share({text:t}).catch(function(){});
    }else if(a==='ren'){
      var nm=prompt('Emri i personit:',p.name);if(nm&&nm.trim()){p.name=nm.trim();save();render()}
    }else if(a==='zero'){
      if(confirm('Të vendos në zero të gjitha materialet e "'+p.name+'"?')){p.c={};p.v={};save();render()}
    }else if(a==='del'){
      if(confirm('Të fshij personin "'+p.name+'" me gjithë listën e tij?')){
        D.people=D.people.filter(function(x){return x.id!==p.id});D.act=D.people[0].id;view=D.act;save();render();
      }
    }else if(a==='bak'){
      var blob=new Blob([JSON.stringify(D)],{type:'application/json'}),u=URL.createObjectURL(blob),l=document.createElement('a');
      l.href=u;l.download='materialet-'+new Date().toISOString().slice(0,10)+'.json';document.body.appendChild(l);l.click();document.body.removeChild(l);
      setTimeout(function(){URL.revokeObjectURL(u)},2000);
    }else if(a==='res'){$('file').click()}
  });
  $('file').onchange=function(){
    var f=this.files[0];this.value='';if(!f)return;
    var r=new FileReader();
    r.onload=function(){
      try{
        var s=JSON.parse(r.result);if(!s||!Array.isArray(s.people)||!s.people.length)throw 0;
        if(!confirm('Kjo zëvendëson të gjitha të dhënat aktuale. Vazhdoj?'))return;
        D=s;D.people.forEach(function(p){p.c=p.c||{};p.v=p.v||{}});if(!find(D.act))D.act=D.people[0].id;view=D.act;save();render();toast('U rikthye');
      }catch(x){toast('Skedari nuk është i vlefshëm')}
    };
    r.readAsText(f);
  };

  load();render();
  if('serviceWorker' in navigator)window.addEventListener('load',function(){navigator.serviceWorker.register('sw.js').catch(function(){})});
})();
</script>
</body>
</html>
